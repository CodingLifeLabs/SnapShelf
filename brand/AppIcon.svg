<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SnapShelf app icon: capture tile resting on a shelf -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1D27"/>
      <stop offset="1" stop-color="#0F1015"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8F7CE0"/>
      <stop offset="1" stop-color="#5A45AE"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- capture tile -->
  <rect x="272" y="212" width="480" height="360" rx="48" fill="url(#tile)"/>
  <rect x="272" y="212" width="480" height="360" rx="48" fill="none" stroke="#FBFBFD" stroke-opacity=".14" stroke-width="6"/>
  <!-- tile "window" chevron detail -->
  <path d="M340 470l84-88 70 72 108-116 82 88" fill="none" stroke="#FBFBFD" stroke-opacity=".5" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shelf -->
  <path d="M160 672h704" stroke="#FBFBFD" stroke-width="40" stroke-linecap="round"/>
  <path d="M300 776h184" stroke="#FBFBFD" stroke-opacity=".35" stroke-width="32" stroke-linecap="round"/>
</svg>
